version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grit
      POSTGRES_PASSWORD: grit
      POSTGRES_DB: grit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grit"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GRIT_DATABASE_URL: "postgresql+psycopg://grit:grit@db:5432/grit"
      GRIT_REDIS_URL: "redis://redis:6379/0"
      GRIT_SECRET_KEY: "change-me-in-production"
      GRIT_GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GRIT_GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GRIT_STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      GRIT_STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      GRIT_LICENSE_PRIVATE_KEY_PATH: "/secrets/license_private.pem"
    volumes:
      - ./license_private.pem:/secrets/license_private.pem:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
