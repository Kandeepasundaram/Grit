name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 0.1.1 or 0.2.0a1)"
        required: true

jobs:
  open-release-pr:
    name: Bump version and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version in pyproject.toml
        run: |
          sed -i 's/^version = .*/version = "${{ inputs.version }}"/' pyproject.toml
          grep "^version" pyproject.toml

      - name: Push release branch and open PR
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git checkout -b release/v${{ inputs.version }}
          git add pyproject.toml
          git commit -m "release: bump to ${{ inputs.version }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "release/v${{ inputs.version }}"
          gh pr create \
            --title "release: bump to ${{ inputs.version }}" \
            --body "Automated version bump to \`${{ inputs.version }}\`. Merging this PR will tag the release and publish to PyPI." \
            --base main \
            --head "release/v${{ inputs.version }}"
