name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: mypy src/

  test:
    name: Unit tests — Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python: ["3.8", "3.11", "3.12"]
        exclude:
          # macos-14 is Apple Silicon (ARM64); setup-python has no 3.8 build for it.
          # Python 3.8 is still covered on Ubuntu and Windows.
          - os: macos-14
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/unit/ --cov=grit --cov-report=xml -v
      - name: Upload coverage
        if: matrix.os == 'ubuntu-22.04' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml

  integration:
    name: Integration tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@grit.test"
          git config --global user.name "Grit CI"
      - run: pytest tests/integration/ -m integration -v

  e2e:
    name: End-to-end tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@grit.test"
          git config --global user.name "Grit CI"
      - run: pytest tests/e2e/ -m e2e -v --timeout=60

  auto-tag:
    name: Tag release
    needs: [lint, test, integration, e2e]
    # Only runs on direct pushes to main (not PRs), and only for release commits.
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'release: bump to')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pyproject.toml
        id: ver
        run: |
          version=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin "v${{ steps.ver.outputs.version }}"
